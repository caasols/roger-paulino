    <section class="home-intro">
      <div class="home-intro__text">
        <!-- LOOP:intro --><p>{{ value }}</p><!-- ENDLOOP:intro -->
        <div class="home-intro__contact">
          <a href="mailto:{{ site_email }}" aria-label="Email">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>
          </a>
          <a href="{{ site_instagram }}" target="_blank" rel="me noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg>
          </a>
        </div>
      </div>
      <!-- IF:portrait -->
      <figure class="home-portrait">
        <img src="{{root}}{{ portrait }}" alt="{{ portraitAlt }}">
      </figure>
      <!-- ENDIF:portrait -->
    </section>

    <section class="feed">
      <!-- LOOP:feed -->
      <article class="feed-block">
        <a class="feed-block__media frame" href="{{root}}{{ url }}">
          <!-- IF:hasImage --><img src="{{root}}{{ heroSrc }}" alt="{{ heroAlt }}" loading="lazy"><!-- ENDIF:hasImage -->
          <!-- IF:noImage --><span class="dotgrid" aria-hidden="true"></span><!-- ENDIF:noImage -->
        </a>
        <div class="feed-block__row">
          <div class="feed-block__id">
            <a href="{{root}}{{ url }}">{{ title }}</a>
            <span class="feed-block__year">{{ year }}</span>
          </div>
          <div class="feed-block__meta">
            <span>{{ place }}</span>
            <!-- IF:typeLabel --><span>{{ typeLabel }}</span><!-- ENDIF:typeLabel -->
            <!-- IF:medium --><span>{{ medium }}</span><!-- ENDIF:medium -->
          </div>
          <!-- IF:excerpt --><p class="feed-block__excerpt">{{ excerpt }}</p><!-- ENDIF:excerpt -->
        </div>
      </article>
      <!-- ENDLOOP:feed -->
    </section>
