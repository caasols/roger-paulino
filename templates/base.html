<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <link rel="canonical" href="{{ canonical }}">
  <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:url" content="{{ og_url }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <meta name="twitter:image" content="{{ og_image }}">
  <link rel="stylesheet" href="{{root}}css/site.css">
  {{ jsonld }}
</head>
<body class="{{ body_class }}">
  <header class="site-header">
    <a class="masthead" href="{{root}}index.html">Roger<br>Paulino</a>
  </header>

  <main>
{{ content }}
  </main>

  <footer class="site-footer cv-footer">
    <div class="cv-col">
      <h2 class="cv-col__h">Solo &amp; duo</h2>
      <ul><!-- LOOP:cv_soloShows --><li><span class="cv-year">{{ year }}</span><span class="cv-text">{{ text }}</span></li><!-- ENDLOOP:cv_soloShows --></ul>
    </div>
    <div class="cv-col">
      <h2 class="cv-col__h">Group shows</h2>
      <ul><!-- LOOP:cv_groupShows --><li><span class="cv-year">{{ year }}</span><span class="cv-text">{{ text }}</span></li><!-- ENDLOOP:cv_groupShows --></ul>
    </div>
    <div class="cv-col">
      <h2 class="cv-col__h">Education</h2>
      <ul><!-- LOOP:cv_education --><li><span class="cv-year">{{ year }}</span><span class="cv-text">{{ text }}</span></li><!-- ENDLOOP:cv_education --></ul>
      <h2 class="cv-col__h">Awards</h2>
      <ul><!-- LOOP:cv_awards --><li><span class="cv-year">{{ year }}</span><span class="cv-text">{{ text }}</span></li><!-- ENDLOOP:cv_awards --></ul>
      <h2 class="cv-col__h">Collections</h2>
      <ul class="cv-col__plain"><!-- LOOP:cv_collections --><li><!-- IF:url --><a href="{{ url }}" target="_blank" rel="noopener">{{ text }}</a><!-- ENDIF:url --><!-- IF:plain -->{{ text }}<!-- ENDIF:plain --></li><!-- ENDLOOP:cv_collections --></ul>
    </div>
    <p class="cv-footer__legal">
      {{ site_name }} &copy; <span class="js-year">{{ site_year }}</span><br>
      <span class="cv-footer__credit">Made with &#9829; by <a href="https://benevol.us" target="_blank" rel="noopener">Benevolus studio</a></span>
    </p>
  </footer>

  <script src="{{root}}js/site.js"></script>
</body>
</html>
