<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <link rel="canonical" href="{{ canonical }}">
  <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:url" content="{{ og_url }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <meta name="twitter:image" content="{{ og_image }}">
  <link rel="stylesheet" href="{{root}}css/site.css">
  {{ jsonld }}
</head>
<body class="{{ body_class }}">
  <header class="site-header">
    <a class="masthead" href="{{root}}index.html">Roger<br>Paulino</a>
    <nav class="site-nav">
      <a href="{{root}}about/index.html">{{ ui_navAbout }}</a>
    </nav>
  </header>

  <main>
{{ content }}
  </main>

  <footer class="site-footer cv-footer">
    <div class="cv-col">
      <h2 class="cv-col__h">Information</h2>
      <a href="{{ site_instagram }}" target="_blank" rel="me noopener">Instagram</a>
      <a href="mailto:{{ site_email }}">{{ site_email }}</a>
    </div>
    <div class="cv-col">
      <h2 class="cv-col__h">Solo &amp; duo</h2>
      <ul><!-- LOOP:cv_soloShows --><li>{{ line }}</li><!-- ENDLOOP:cv_soloShows --></ul>
    </div>
    <div class="cv-col">
      <h2 class="cv-col__h">Group shows</h2>
      <ul><!-- LOOP:cv_groupShows --><li>{{ line }}</li><!-- ENDLOOP:cv_groupShows --></ul>
    </div>
    <div class="cv-col">
      <h2 class="cv-col__h">Education</h2>
      <ul><!-- LOOP:cv_education --><li>{{ line }}</li><!-- ENDLOOP:cv_education --></ul>
      <h2 class="cv-col__h">Awards</h2>
      <ul><!-- LOOP:cv_awards --><li>{{ line }}</li><!-- ENDLOOP:cv_awards --></ul>
      <h2 class="cv-col__h">Collections</h2>
      <ul><!-- LOOP:cv_collections --><li>{{ line }}</li><!-- ENDLOOP:cv_collections --></ul>
    </div>
    <p class="cv-footer__legal">{{ site_name }} &copy; {{ site_year }}</p>
  </footer>

  <script src="{{root}}js/site.js"></script>
</body>
</html>
